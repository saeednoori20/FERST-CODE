
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer T-Shirt</title>
  <link rel="stylesheet" href="stelyl.css" />
</head>

<body>

  <header>
    <nav>
      <ul class="list">
        <li><a href="#">Main Menu</a></li>

        <li>
          <svg class="icon" viewBox="0 0 80.593 122.88">
            <polygon points="0,0 30.82,0 80.593,61.44 30.82,122.88 0,122.88 49.772,61.44 0,0" />
          </svg>
        </li>

        <li><a href="#">Shopping Cart</a></li>

        <li>
          <svg class="icon" viewBox="0 0 80.593 122.88">
            <polygon points="0,0 30.82,0 80.593,61.44 30.82,122.88 0,122.88 49.772,61.44 0,0" />
          </svg>
        </li>

        <li><a href="#">...</a></li>

        <li>
          <svg class="icon" viewBox="0 0 80.593 122.88">
            <polygon points="0,0 30.82,0 80.593,61.44 30.82,122.88 0,122.88 49.772,61.44 0,0" />
          </svg>
        </li>

        <li><a href="#">Place Order</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="cart">

      <!-- Product Image -->
      <div class="image">
        <img
          src="Black and Orange T-Shirt Detail Collage.png"
          alt="Summer T-Shirt"
        />
      </div>

      <!-- Product Details -->
      <div class="details">

        <h1>Summer T-Shirt</h1>

        <div class="product-rating">
          <p>★★★★★ 5.0</p>
        </div>

        <p>
          A lightweight, breathable summer T-shirt
          designed for all-day comfort and effortless style.
        </p>

        <strong>$120</strong>

        <!-- Size Selector -->
        <h3>Size Selector</h3>

        <div class="size-selector">
          <button type="button">S</button>
          <button type="button">L</button>
          <button type="button">XL</button>
          <button type="button">XXL</button>
        </div>

        <!-- Color Selector -->
        <h3>Color Selector</h3>

        <div class="color-selector">
          <button type="button">Red</button>
          <button type="button">Blue</button>
          <button type="button">Black</button>
        </div>

        <!-- Quantity Selector -->
        <h3>Quantity</h3>

        <div class="quantity-selector">
          <button type="button">-</button>
          <span>1</span>
          <button type="button">+</button>
        </div>

        <!-- Add to Cart -->
        <button type="button" class="add-to-cart">
          Add to Cart
        </button>

      </div>

    </div>
  </main>

</body>

</html>
